name: CI

on: push

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run pytest tests/

  # hassfest + hacs validation + HACS-sync deploy, shared with other rn-ax
  # HA integration repos rather than duplicated here -- see
  # https://github.com/rn-ax/poppycock/blob/main/.github/workflows/ha-integration-ci.yml
  ha-integration-ci:
    needs: [pytest]
    permissions:
      contents: read
      pull-requests: write
    uses: rn-ax/poppycock/.github/workflows/ha-integration-ci.yml@main
    # fork_status has no entry yet in home-assistant/brands -- skip that
    # check rather than blocking CI on an unrelated community-repo PR.
    # Requires rn-ax/poppycock#11 (hacs_ignore input) merged to take effect.
    with:
      hacs_ignore: brands
    secrets: inherit
