name: CI

on: push

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: uv sync --group dev
      - run: uv run pytest tests/

  # hassfest + hacs validation + HACS-sync deploy, shared with other rn-ax
  # HA integration repos rather than duplicated here -- see
  # https://github.com/rn-ax/poppycock/blob/main/.github/workflows/ha-integration-ci.yml
  ha-integration-ci:
    needs: [pytest]
    permissions:
      contents: read
      pull-requests: write
    uses: rn-ax/poppycock/.github/workflows/ha-integration-ci.yml@main
    # fork_status has no entry yet in home-assistant/brands -- skip that
    # check rather than blocking CI on an unrelated community-repo PR.
    # `issues` is skipped org-wide: this org tracks work in atask, not
    # GitHub Issues, so has_issues stays false everywhere -- HACS's own
    # check requires it enabled, which isn't a real correctness problem.
    with:
      hacs_ignore: brands issues
    secrets: inherit
